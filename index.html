  <body>
    <!-- 리엑트는 SPA(.html 1개) 구조이다. -->

    <!-- div 안에 root를 지우면 안됨. -->

    <!-- 최조로 ROOT에 .innerHTML( 특정마크업내 내용물 대입 속성 ) 해주는 코드가 main.jsx 포함-->
    <script type="module" src="/src/main.jsx"></script>
